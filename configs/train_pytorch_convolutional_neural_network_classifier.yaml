dataset_dir: data/train/timesteps_{dataset_id}
output_dir: data/models/pytorch_convolutional_neural_network_classifier/{model_id}

split:
  train_fraction: 0.6
  validation_fraction: 0.2
  gap_timesteps: 10

labels:
  lobe: 0
  exhaust: 1
  o_point: 2
  x_point: 3
  dayside: 4

features:
  # raw_vdf: xz-slice + log10 CNN input (default, unaffected by this key when omitted)
  # hermite: full Hermite-spectra cube CNN input; requires a dataset created
  #   with hermite.enabled: true in configs/create_dataset.yaml
  representation: raw_vdf
  #representation: hermite
  # Must match the dataset's hermite.rotate setting (configs/create_dataset.yaml)
  # so inference-time extraction (coordinate_prediction.py) can replicate it.
  hermite_rotate: false
  downsample_factor: 1
  batch_size: 512
  n_jobs: -1
  log_eps: 1e-30
  cache:
    enabled: true
    dir: data/train/timesteps_{dataset_id}/cache
    filename: xz_log_cache.npy
    metadata_filename: xz_log_cache_metadata.npz
    rebuild: false
    batch_size: 64
    n_jobs: 8

model:
  channels: [16, 32, 64]
  # adaptive_pool_shape needs 2 values for features.representation: raw_vdf
  # (2D CNN) or 3 values for features.representation: hermite (3D CNN), e.g.
  # [2, 2, 2] for the default hermite.order: 22 with 3 channel blocks above
  # (each block halves the cube: 22 -> 11 -> 5 -> 2).
  adaptive_pool_shape: [4, 4]
  classifier_size: 64
  dropout: 0.2
  #class_weight: sqrt_balanced
  class_weight: none
  #class_weight: balanced
  class_weights: {}
  sampler:
    enabled: false
    mode: none
    class_weights: {}
  weight_decay: 0.0001
  batch_size: 256
  learning_rate: 0.0003
  max_epochs: 300
  early_stopping: true
  patience: 15
  tolerance: 0.0001
  random_state: 1234
  device: auto
  deterministic: false
  prediction_batch_size: 512

failure_plots:
  enabled: true
  splits: [validation, test]
  max_per_pair: 8
  vdflim: 2000000.0
